<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZG QUEST</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <main id="screen-start" class="screen active">
      <header>
        <h1>ZG QUEST</h1>
        <p class="subtitle">Odkrywaj Zieloną Górę</p>
      </header>
      <section class="form-group">
        <label for="username">Wpisz swój nick:</label>
        <input type="text" id="username" placeholder="Twój pseudonim..." maxlength="15">
      </section>
      <button id="btn-start" onclick="startGame()">Graj</button>
    </main>
  </div>
  <script src="game.js"></script>
</body>
</html>
